[project]
name = "secondlook"
version = "0.1.0"
description = "SecondLook — AI second-opinion copilot for rare and treatment-exhausted cancers"
requires-python = ">=3.11"
dependencies = [
    "hgvs>=1.5",
    "httpx>=0.27",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "playwright>=1.49",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
markers = [
    "integration: hits live external APIs",
]
